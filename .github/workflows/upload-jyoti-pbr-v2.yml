name: Upload Jyoti PBR production model

on:
  push:
    branches: [ops/jyoti-upload-real-model]
    paths:
      - ".github/workflows/upload-jyoti-pbr-v2.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore staged PBR GLB
        shell: bash
        run: |
          set -euo pipefail
          xz -dc .tmp/jyoti-exterior-pbr-v2.glb.xz > /tmp/exterior-v1.glb
          echo "46cde07ba8a59e04e198c778189f24eff89f05eb73e823369fcc7594cbf05bf2  /tmp/exterior-v1.glb" | sha256sum -c -
          test "$(head -c 4 /tmp/exterior-v1.glb)" = "glTF"
          stat -c '%n %s bytes' /tmp/exterior-v1.glb

      - name: Upload PBR Jyoti GLB to production R2
        run: >-
          npx --yes wrangler@4
          r2 object put
          rekixo-3d-assets/projects/jyoti-paradise/models/exterior-v1.glb
          --file=/tmp/exterior-v1.glb
          --content-type=model/gltf-binary
          --remote

      - name: Verify production R2 object
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 r2 object get rekixo-3d-assets/projects/jyoti-paradise/models/exterior-v1.glb --file=/tmp/roundtrip.glb --remote
          echo "46cde07ba8a59e04e198c778189f24eff89f05eb73e823369fcc7594cbf05bf2  /tmp/roundtrip.glb" | sha256sum -c -

      - name: Verify live PBR model
        shell: bash
        run: |
          set -euo pipefail
          API="https://ar3dstudio.in/3Dprojects/api/projects/jyoti-paradise"
          for attempt in 1 2 3 4 5; do
            curl -fsSL "$API" -o /tmp/project.json
            if grep -Fq '"available":true' /tmp/project.json; then
              MODEL_URL="$(python -c "import json; d=json.load(open('/tmp/project.json')); print('https://ar3dstudio.in'+d['model']['url'])")"
              code="$(curl -sS -o /tmp/live.glb -w '%{http_code}' "$MODEL_URL")"
              echo "model=$MODEL_URL status=$code"
              test "$code" = "200"
              echo "46cde07ba8a59e04e198c778189f24eff89f05eb73e823369fcc7594cbf05bf2  /tmp/live.glb" | sha256sum -c -
              exit 0
            fi
            sleep 3
          done
          cat /tmp/project.json
          exit 1
